<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>boder-radius2</title>
  <style>
    *{margin: 0; padding: 0;}

    body{}
    .box{
      width: 300px;
      height: 400px;
      border: 1px solid #000;
      border-radius: 50px;
      overflow: hidden;
    }
    .child{
      background-color: rgba(255,224,157,0.5);
      height: 100%;
    }
  </style>
</head>
<body>
  <div class="box">
    <div class="child">내용</div>
  </div>
</body>
</html>
