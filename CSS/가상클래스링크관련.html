<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>가상클래스 링크관련</title>
  <style>
    li{color: #68f;}
    a:link,
    a:visited,
    a:active{color: #333; text-decoration: none;}
    a:hover{
      color: #68f;
      text-decoration: underline;
    }
    a:focus{
      color: #f00;
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <ul>
    <li><span>가상클래스</span></li>
    <li><a href="https://www.naver.com">메뉴1</a></li>
    <li><a href="https://www.google.com">메뉴2</a></li>
    <li><a href="https://www.naver.com">메뉴3</a></li>
  </ul>
</body>
</html>
